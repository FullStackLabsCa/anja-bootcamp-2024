openapi: 3.0.3
info:
  title: Active Life Canada
  description: |-
    
    Cities across Canada manage a variety of recreational facilities, such as community centers, sports complexes, and swimming pools, each offering programs tailored to their unique capabilities and resources. These programs, ranging from swimming and skating to fitness, dance, and cooking & nutrition, are designed to serve diverse age groups, from children and youth to seniors.
    
    Below are the endpoints provided for the Active Life Canada application which allows you to register as a member, add a family member to your family group, offer a course, define fee for the course, members can register for a course and managers can update the details of a offered course.

  contact:
    email: apiteam@activelifecanada.ca
  version: 1.0.0
servers:
  - url: http://localhost:8082/api/v1
tags:
  - name: authentication management
    description: SignIn and signUp
  - name: family management
    description: Register member, login member, add member to family group
  - name: program management
    description: Offer a course, edit a offered course, create fee for offered course
  - name: dashboard
    description: Display data on dashboard
  - name: course registration management
    description: Enroll into a course, withdraw from course, get all registered courses and waitlisted courses
paths:
  /signUp:
    post:
      tags:
        - authentication management
      summary: Register a member
      description: This will register a member and send an activation link to the member using ems service
      operationId: regsiterMember
      requestBody:
        description: Register a member
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMemberRequest'
        required: true
      responses:
        '200':
          description: Member registered successfully and an activation link is sent to you
        '400':
          description: Invalid fields validation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /login:
    post:
      tags:
        - authentication management
      summary: Login member
      description: Login member
      operationId: loginMember
      requestBody:
        description: Authentication successfull, you'll receive an otp to verify
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMemberRequest'
        required: true
      responses:
        '200':
          description: Credentials verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /login/2fa:
    post:
      tags:
        - authentication management
      summary: 2 factor authentication
      description: Login member
      operationId: multiFactorAuthLogin
      requestBody:
        description: Authenticate login
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMemberRequest'
        required: true
      responses:
        '200':
          description: Credentials verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /activate/{activationId}:
    get:
      tags:
        - authentication management
      summary: 2 factor authentication
      description: Login member
      operationId: activateAccount
      parameters:
        - name: activationId
          in: path
          description: member Id to fetch the member details
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credentials verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /dashboard:
    get:
      tags:
        - dashboard
      summary: Get the data to display on dashboard
      description: Get the data to display on dashboard such as waitlisted courses and registered courses
      operationId: dashboard
      parameters:
        - name: X-security-header
          in: header
          description: Group Id for authentication
          required: true
          schema:
            type: object
            properties:
              familyMemberId:
                type: string
      responses:
        '200':
          description: Dashboard details
          content:
            application/json:
              schema:
                type: object
                properties:
                  waitlistedCourses:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseDetailsResponse'
                  enrolledCourses:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseDetailsResponse'
        '400':
          description: Invalid fields validation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /members:
    post:
      tags:
        - family management
      summary: Add a member to a family group
      description: Add a member to a family group
      operationId: addToFamilyGroup
      parameters:
        - name: X-security-header
          in: header
          description: Group Id for authentication
          required: true
          schema:
            type: object
            properties:
              familyMemberId:
                type: string
      requestBody:
        description: Add a member to a family group
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
        required: true
      responses:
        '200':
          description: Member registered successfully, you'll receive a activation link
        '400':
          description: Invalid fields validation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /members/{memberId}:
    patch:
      tags:
        - family management
      summary: Update a family member
      description: Update a family member
      operationId: updateMember
      parameters:
        - name: X-security-header
          in: header
          description: Group Id for authentication
          required: true
          schema:
            type: object
            properties:
              familyMemberId:
                type: string
        - name: memberId
          in: path
          description: member Id to fetch the member details
          required: true
          schema:
            type: string
      requestBody:
        description: Add a member to a family group
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
        required: true
      responses:
        '200':
          description: Member registered successfully, you'll receive a activation link
        '400':
          description: Invalid fields validation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - family management
      summary: Get member details
      description: Get member details
      operationId: memberDetails
      parameters:
        - name: X-security-header
          in: header
          description: Group Id for authentication
          required: true
          schema:
            type: object
            properties:
              familyMemberId:
                type: string
        - name: memberId
          in: path
          description: member Id to fetch the member details
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Member details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetails'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - family management
      summary: Delete a member
      description: Delete a member will mark the member as Inactive
      operationId: deleteMember
      parameters:
        - name: X-security-header
          in: header
          description: Group Id for authentication
          required: true
          schema:
            type: object
            properties:
              familyMemberId:
                type: string
        - name: memberId
          in: path
          description: member Id to delete a member
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Member deleted successfully
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /registeredCourses:
    get:
      tags:
        - course registration management
      summary: Find registered courses by member id
      description: Find registered courses by member id
      operationId: registeredCourseByMemberId
      parameters:
        - name: X-security-header
          in: header
          description: Group Id for authentication
          required: true
          schema:
            type: object
            properties:
              familyMemberId:
                type: string
      responses:
        '200':
          description: Registered courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseDetailsResponse'
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /waitlistedCourses:
    post:
      tags:
        - course registration management
      summary: Add to waitlist
      description: Add to waitlist
      operationId: addToWaitlist
      parameters:
        - name: X-security-header
          in: header
          description: Group Id for authentication
          required: true
          schema:
            type: object
            properties:
              familyMemberId:
                type: string
      responses:
        '200':
          description: Waitlisted courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseDetailsResponse'
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - course registration management
      summary: Find waitlistedCourses courses by member id
      description: Find waitlistedCourses courses by member id
      operationId: waitlistedCoursesByMemberId
      parameters:
        - name: X-security-header
          in: header
          description: Group Id for authentication
          required: true
          schema:
            type: object
            properties:
              familyMemberId:
                type: string
      responses:
        '200':
          description: Waitlisted courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseDetailsResponse'
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /offeredCourses:
    post:
      tags:
        - program management
      summary: Offer a course
      description: Offer a course
      operationId: offerCourse
      requestBody:
        description: Offer a course
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRequest1'
        required: true
      responses:
        '200':
          description: Course offered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      tags:
        - program management
      summary: Update a offered course
      description: Update a offered course
      operationId: updateCourse
      requestBody:
        description: Update a offered course
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdateRequest'
        required: true
      responses:
        '200':
          description: Course offered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
        '400':
          description: Invalid phoneNumber supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - program management
      summary: Get all offered courses
      description: Get all offered courses
      operationId: allCourses
      responses:
        '200':
          description: Course details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseDetailsResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /offeredCourses/cart:
    post:
      tags:
        - course registration management
      summary: Add course to cart
      description: Add course to cart
      operationId: addToCart
      parameters:
        - name: X-security-header
          in: header
          description: Group Id for authentication
          required: true
          schema:
            type: object
            properties:
              familyMemberId:
                type: string
      responses:
        '200':
          description: Successfully added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - course registration management
      summary: Get all courses in cart
      operationId: getCart
      parameters:
        - name: X-security-header
          in: header
          description: Group Id for authentication
          required: true
          schema:
            type: object
            properties:
              familyMemberId:
                type: string
      responses:
        '200':
          description: Successfully added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /offeredCourses/cart/pay:
    post:
      tags:
        - course registration management
      summary: Pay for enrolling into the course
      description: Pay for course
      operationId: payCourseRegistration
      responses:
        '200':
          description: Payment successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /enrollments/{enrollmentId}:
    delete:
      tags:
        - course registration management
      summary: Withdraw from a course
      description: Withdraw from a course
      operationId: withdrawFromCourse
      parameters:
        - name: enrollmentId
          in: path
          description: Member's course enrollment Id
          required: true
          schema:
            type: string
        - name: X-security-header
          in: header
          description: Group Id for authentication
          required: true
          schema:
            type: object
            properties:
              familyMemberId:
                type: string
      responses:
        '200':
          description: Successfully withdrawn from the course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /offeredCourses/search:
    post:
      tags:
        - program management
      summary: Search courses
      description: Search courses
      operationId: searchCourse
      requestBody:
        description: Search courses
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          description: All course details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseDetailsResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
components:
  schemas:
    RegisterMemberRequest:
      required:
        - name
        - dob
        - gender
        - streetNo
        - streetName
        - city
        - province
        - country
        - homePhone
        - username
        - password
        - preferredModeOfCommunication
      type: object
      properties:
        name:
          type: string
          description: Name of the member
          example: Firstname Lastname
        dob:
          type: string
          description: Date of birth of the member
          example: 10/05/1999
        gender:
          type: string
          description: Gender of the member
          example: Male
        emailId:
          type: string
          description: Email Id of the member
          example: example@email.com
        streetNo:
          type: string
          description: House number of the member
          example: 273
        streetName:
          type: string
          description: Street address of the member
          example: SanteeGate
        city:
          type: string
          description: City of the member
          example: Mississauga
        province:
          type: string
          description: Province to which the member belongs
          example: Ontario
        country:
          type: string
          description: Country to which the member belongs
          example: Canada
        homePhone:
          type: string
          description: Home phone number
          example: 222-555-5555
        businessPhone:
          type: string
          description: Business phone number
          example: 226-444-3434
        language:
          type: string
          description: Language spoken by the customer
          example: English
        username:
          type: string
          description: Username to be used by the member to login
          example: example36
        password:
          type: string
          description: password to login
          example: 234344
        preferredModeOfCommunication:
          type: string
          example: HOME_PHONE
      xml:
        name: '##default'
    AddMemberRequest:
      required:
        - name
        - dob
        - gender
        - streetNo
        - streetName
        - city
        - province
        - country
        - homePhone
        - username
        - preferredModeOfCommunication
      type: object
      properties:
        name:
          type: string
          description: Name of the member
          example: Firstname Lastname
        dob:
          type: string
          description: Date of birth of the member
          example: 10/05/1999
        gender:
          type: string
          description: Gender of the member
          example: Male
        emailId:
          type: string
          description: Email Id of the member
          example: example@email.com
        streetNo:
          type: string
          description: House number of the member
          example: 273
        streetName:
          type: string
          description: Street address of the member
          example: SanteeGate
        city:
          type: string
          description: City of the member
          example: Mississauga
        province:
          type: string
          description: Province to which the member belongs
          example: Ontario
        country:
          type: string
          description: Country to which the member belongs
          example: Canada
        homePhone:
          type: string
          description: Home phone number
          example: 222-555-5555
        businessPhone:
          type: string
          description: Business phone number
          example: 226-444-3434
        language:
          type: string
          description: Language spoken by the customer
          example: English
        username:
          type: string
          description: Username to be used by the member to login
          example: example36
        preferredModeOfCommunication:
          type: string
          description: Home phone/Business phone/email
      xml:
        name: '##default'
    MemberDetails:
      type: object
      properties:
        memberId:
          type: string
        name:
          type: string
          description: Name of the member
          example: Firstname Lastname
        dob:
          type: string
          description: Date of birth of the member
          example: 10/05/1999
        gender:
          type: string
          description: Gender of the member
          example: Male
        emailId:
          type: string
          description: Email Id of the member
          example: example@email.com
        streetNo:
          type: string
          description: House number of the member
          example: 273
        streetName:
          type: string
          description: Street address of the member
          example: SanteeGate
        city:
          type: string
          description: City of the member
          example: Mississauga
        province:
          type: string
          description: Province to which the member belongs
          example: Ontario
        country:
          type: string
          description: Country to which the member belongs
          example: Canada
        homePhone:
          type: string
          description: Home phone number
          example: 222-555-5555
        businessPhone:
          type: string
          description: Business phone number
          example: 226-444-3434
        language:
          type: string
          description: Language spoken by the customer
          example: English
        username:
          type: string
          description: Username to be used by the member to login
          example: example36
        groupId:
          type: string
        credits:
          type: integer
          format: int64
          example: 300
        failedLoginAttempts:
          type: integer
          format: int64
          example: 10
      xml:
        name: '##default'
    LoginMemberRequest:
      required:
        - memberLoginId
        - groupPin
      type: object
      properties:
        memberLoginId:
          type: string
          description: Username to be used by the member to login
          example: example36
        groupPin:
          type: string
          description: Group pin to login
          example: 1234556
      xml:
        name: '##default'
    SearchRequest:
      type: object
      properties:
        courseNane:
          type: string
          example: basketball
        startDate:
          type: string
          example: 10/01/2023
        endDate:
          type: string
          example: basketball
        city:
          type: string
          example: mississauga
        province:
          type: string
          example: ontario
        category:
          type: string
        subCategory:
          type: string
        ageGroup:
          type: string
      xml:
        name: '##default'
    CourseRequest1:
      required:
        - courseId
        - facilityId
        - startDate
        - endDate
        - noOfClassesOffered
        - startTime
        - endTime
        - isAllDayCourse
        - registrationStartDate
        - noOfSpots
        - residentCourseFee
        - nonResidentCourseFee
      type: object
      properties:
        courseId:
          type: string
          description: Course Id
        facilityId:
          type: string
          description: Course Id
        startDate:
          type: string
          description: Course start date
          example: 2010-09-12
        endDate:
          type: string
          description: Course end date
          example: 2010-09-12
        noOfClassesOffered:
          type: integer
          format: int32
          description: Number of classes offered
          example: 10
        startTime:
          type: string
          description: Class start time
        endTime:
          type: string
          description: Class end time
        isAllDayCourse:
          type: boolean
          example: true
        registrationStartDate:
          type: string
          description: Registration start date
          example: 2010-09-12
        noOfSpots:
          type: integer
          format: int32
          example: 10
        residentCourseFee:
          type: integer
          format: int32
          example: 180
        nonResidentCourseFee:
          type: integer
          format: int32
          example: 180
      xml:
        name: '##default'
    CourseRequest2:
      required:
        - startDate
        - endDate
        - noOfClassesOffered
        - startTime
        - endTime
        - isAllDayCourse
        - registrationStartDate
        - noOfSpots
        - residentCourseFee
        - nonResidentCourseFee
      type: object
      properties:
        startDate:
          type: string
          description: Course start date
          example: 2010-09-12
        endDate:
          type: string
          description: Course end date
          example: 2010-09-12
        noOfClassesOffered:
          type: integer
          format: int32
          description: Number of classes offered
          example: 10
        startTime:
          type: string
          description: Class start time
        endTime:
          type: string
          description: Class end time
        isAllDayCourse:
          type: boolean
          example: true
        registrationStartDate:
          type: string
          description: Registration start date
          example: 2010-09-12
        noOfSpots:
          type: integer
          format: int32
