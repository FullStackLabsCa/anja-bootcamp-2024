spring:
  jpa:
    show-sql: true
    defer-datasource-initialization: true
  artemis:
    ens-queue: ens_test_queue
    otp-queue: otp_test_queue
application:
  properties:
    otp:
      verification-attempt: 3
      otp-attempt: 5
      validation-lock-period-minutes: 120
      attempt-lock-period-minutes: 480
      expire-minutes: 10
      try-unlock-seconds: 10
