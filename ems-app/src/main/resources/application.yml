server:
  port: 8080
  ssl:
    enabled: true
    key-store: classpath:ems_keystore.p12
    key-store-password: changeit
spring:
  application.name: ems-app
  datasource:
    url: jdbc:postgresql://localhost:5432/ems_for_active_life
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate.ddl-auto: update
    show-sql: true
  artemis:
    mode: native
    host: localhost
    port: 61616
    user: artemis
    password: artemis
    ens-queue: ens_active_life_queue
    otp-queue: otp_active_life_queue
application:
  properties:
    otp:
      verification-attempt: 3
      otp-attempt: 5
      validation-lock-period-minutes: 120
      attempt-lock-period-minutes: 480
      expire-minutes: 10
      try-unlock-seconds: 10
