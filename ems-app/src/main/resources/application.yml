server.port: 8080
spring:
  application.name: ems-app
  datasource:
    url: jdbc:postgresql://localhost:5432/ems
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate.ddl-auto: update
    show-sql: true
  artemis:
    mode: native
    host: localhost
    port: 61616
    user: artemis
    password: artemis
    ens-queue: ens_queue
    otp-queue: otp_queue
application:
  properties:
    otp:
      verification-attempt: 3
      otp-attempt: 5
      validation-lock-period-minutes: 120
      attempt-lock-period-minutes: 480
      expire-minutes: 10
      try-unlock-seconds: 10
