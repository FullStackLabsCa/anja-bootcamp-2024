server.port: 8081
spring:
  application.name: ems-message-processor-app
  datasource:
    url: jdbc:postgresql://localhost:5432/ems
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate.ddl-auto: none
    show-sql: true
  artemis:
    mode: native
    host: localhost
    port: 61616
    user: artemis
    password: artemis
    ens-queue: ens_queue
    otp-queue: otp_queue
twilio:
  credentials:
    auth-token: ${AUTH_TOKEN}
    messaging-service-id: ${MESSAGING_SERVICE_ID}
    sid: ${SID}