spring:
  artemis:
    ens-queue: ens_queue
    otp-queue: otp_queue
    dlq: ems-dlq
application:
  properties:
    otp:
      verification-attempt: 3
      otp-attempt: 5
      validation-lock-period-minutes: 120
      attempt-lock-period-minutes: 480
      expire-minutes: 10
      try-unlock-seconds: 10
twilio:
  credentials:
    auth-token: ${AUTH_TOKEN}
    messaging-service-id: ${MESSAGING_SERVICE_ID}
    sid: ${SID}
logging:
  level:
    root: INFO